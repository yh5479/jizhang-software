# 云打包工作流：推送代码到 GitHub 后，自动编译出 Android APK
# 你本机无需安装 Android SDK / Android Studio。
# 产物在 GitHub 仓库的 Actions → 最近一次运行 → Artifacts 里下载 app-debug.apk
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # 允许在 GitHub 网页上手动点 "Run workflow" 触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17 (Capacitor 6 needs JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install npm dependencies
        run: npm install

      - name: Build web bundle (Vite → dist)
        run: npm run build

      - name: Sync Capacitor Android (copy web into native shell)
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & accept licenses
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
